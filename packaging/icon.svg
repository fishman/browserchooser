<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#2e3440"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
  <!-- back window -->
  <g transform="rotate(-10 512 512)">
    <rect x="330" y="170" width="440" height="400" rx="34" fill="#4c566a"/>
  </g>
  <!-- front window -->
  <g>
    <rect x="250" y="350" width="520" height="470" rx="40" fill="#3b4252"/>
    <rect x="250" y="350" width="520" height="120" rx="40" fill="#434c5e"/>
    <rect x="250" y="440" width="520" height="40" fill="#434c5e"/>
    <!-- traffic lights -->
    <circle cx="320" cy="410" r="26" fill="#bf616a"/>
    <circle cx="392" cy="410" r="26" fill="#ebcb8b"/>
    <circle cx="464" cy="410" r="26" fill="#a3be8c"/>
    <!-- address bar -->
    <rect x="530" y="378" width="210" height="64" rx="32" fill="#2e3440"/>
    <!-- content lines -->
    <rect x="300" y="520" width="320" height="24" rx="12" fill="#4c566a"/>
    <rect x="300" y="570" width="420" height="24" rx="12" fill="#4c566a"/>
    <rect x="300" y="620" width="370" height="24" rx="12" fill="#4c566a"/>
    <rect x="300" y="670" width="200" height="24" rx="12" fill="#4c566a"/>
  </g>
  <!-- chain links: back (link1) + front frost (link2) -->
  <rect x="430" y="470" width="180" height="180" rx="52" fill="none" stroke="#5e81ac" stroke-width="44" transform="rotate(45 520 560)"/>
  <rect x="320" y="585" width="170" height="170" rx="50" fill="none" stroke="#88c0d0" stroke-width="44" transform="rotate(45 405 670)"/>
</svg>

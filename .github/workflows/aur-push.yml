name: AUR push

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Derive and validate version
        id: ver
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          v="$(git describe --tags --exact-match "$HEAD_SHA" | sed 's/^v//')"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            { echo "no vMAJOR.MINOR.PATCH tag at $HEAD_SHA" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD + .SRCINFO
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          docker run --rm -e VERSION="$VERSION" -e GIT_EMAIL="$GIT_EMAIL" -v "$PWD:/build" \
            archlinux/archlinux:base-devel bash -c '
            cd /build
            useradd -m builder
            chown -R builder /build
            runuser -u builder --preserve-environment -- make aur-pkgbuild
            runuser -u builder --preserve-environment -- make aur-x11-pkgbuild
            runuser -u builder --preserve-environment -- sh -c "cd /build/.build-aur && makepkg --printsrcinfo > .SRCINFO"
            runuser -u builder --preserve-environment -- sh -c "cd /build/.build-aur-x11 && makepkg --printsrcinfo > .SRCINFO"
          '

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_KEY" ] || [ -z "$AUR_GIT_EMAIL" ]; then
            echo "missing AUR_SSH_KEY/AUR_GIT_EMAIL secrets, skipping push"
            exit 0
          fi

          # Regenerate any package dir the docker step did not leave on the
          # runner, so a missing generated dir cannot abort the push. PKGBUILD
          # is pure sed; .SRCINFO needs Arch makepkg, so do that in a container
          # only when it is missing.
          regen() {
            name=$1; src=$2
            tpl="packaging/$name/PKGBUILD"
            [ -f "$tpl" ] || { echo "missing $tpl" >&2; exit 1; }
            rm -rf "$src" && mkdir -p "$src"
            sed "s/@PKGVER@/$VERSION/; s/@PKGEMAIL@/$AUR_GIT_EMAIL/" "$tpl" > "$src/PKGBUILD"
            docker run --rm -v "$PWD:/build" archlinux/archlinux:base-devel bash -c "
              cd /build/$src
              useradd -m builder
              chown -R builder /build/$src
              runuser -u builder --preserve-environment -- makepkg --printsrcinfo > .SRCINFO
            "
          }
          [ -f .build-aur/PKGBUILD ]      || regen browserchooser .build-aur
          [ -f .build-aur-x11/PKGBUILD ]  || regen browserchooser-x11 .build-aur-x11

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          for pair in "browserchooser .build-aur" "browserchooser-x11 .build-aur-x11"; do
            set -- $pair
            name=$1
            src=$2
            rm -rf "/tmp/aur-$name"
            git clone "ssh://aur@aur.archlinux.org/$name.git" "/tmp/aur-$name"
            cp "$src/PKGBUILD" "$src/.SRCINFO" "/tmp/aur-$name/"
            cd "/tmp/aur-$name"
            git config user.name "browserchooser release"
            git config user.email "$AUR_GIT_EMAIL"
            git add PKGBUILD .SRCINFO
            git commit -m "$name $VERSION"
            git push
            cd - >/dev/null
          done

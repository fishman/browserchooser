name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deb-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Fyne cgo deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev \
            libxkbcommon-dev libdbus-1-dev

      - name: Derive and validate version
        id: ver
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            { echo "tag $REF is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build deb
        run: make deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}

      - name: Build rpm
        run: make rpm
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-rpm
          path: dist/

  arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive and validate version
        id: ver
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            { echo "tag $REF is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build Arch packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          docker run --rm -e VERSION="$VERSION" -e GIT_EMAIL="$GIT_EMAIL" -v "$PWD:/build" \
            archlinux/archlinux:base-devel bash -c '
            pacman -Syu --noconfirm >/dev/null
            pacman -S --noconfirm --needed git go libglvnd mesa libx11 \
              libxrandr libxinerama libxcursor libxi libxxf86vm \
              libxkbcommon wayland xorgproto >/dev/null
            cd /build
            useradd -m builder
            chown -R builder /build
            runuser -u builder --preserve-environment -- make aur
            runuser -u builder --preserve-environment -- make aur-x11
          '

      - name: Upload Arch packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: |
            .build-aur/*.pkg.tar.zst
            .build-aur-x11/*.pkg.tar.zst

  release:
    needs: [deb-rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
